<!DOCTYPE html>
<html lang="zh-CN">
<head> 
    <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>无限视界</title> 
    <script src="https://cdn.tailwindcss.com"></script> 
    <script src="https://unpkg.com/oh-my-live2d@latest"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet"> 
    <style> 
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;500;700&family=JetBrains+Mono:wght@400&display=swap');
    :root {
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --bg-color: #050505;
    }
    /* --- 核心修复：彻底隐藏原生鼠标 --- */
    /* 强制所有元素（包括输入框、按钮、链接）都不显示原生光标 */
    *, *::before, *::after {
        cursor: none !important;
    }
    body {
        background-color: var(--bg-color);
        color: white;
        font-family: 'Noto Sans SC', sans-serif;
        overflow: hidden;
        cursor: none;
        height: 100vh;
        width: 100vw;
        user-select: none;
    }

    /* --- 1. 鼠标样式 (沿用) --- */
    #cursor {
        position: fixed; top: 0; left: 0; width: 20px; height: 20px;
        border: 2px solid var(--primary); border-radius: 50%;
        pointer-events: none; transform: translate(-50%, -50%); z-index: 9999;
        transition: width 0.2s, height 0.2s, background-color 0.2s, border-color 0.2s; mix-blend-mode: difference;
    }
    #cursor.hovered { width: 50px; height: 50px; background-color: rgba(0, 243, 255, 0.2); border-color: var(--secondary); }
    #cursor.blackhole-hover { width: 80px; height: 80px; border-color: white; background-color: rgba(255,255,255,0.1); mix-blend-mode: normal; }
    /* 输入状态下的鼠标样式 */
    #cursor.text-mode { width: 4px; height: 20px; border-radius: 2px; background-color: var(--primary); border: none; mix-blend-mode: normal; }

    /* --- 2. 背景画布 --- */
    #galaxy-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }

    /* --- 3. 顶边栏 (沿用，初始隐藏) --- */
    #system-navbar {
        transform: translateY(-100%); transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #system-navbar.visible { transform: translateY(0); }
    
    .nav-link {
        position: relative; font-size: 0.8rem; font-weight: 700; color: #555;
        text-decoration: none; padding: 5px 0; transition: all 0.3s ease;
        display: flex; align-items: center; gap: 6px;
    }
    .nav-link:hover, .nav-link.active { color: var(--primary); text-shadow: 0 0 8px rgba(0, 243, 255, 0.5); }
    .shadow-blue-glow { text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }

    /* --- 4. 初始引导层 (The Lid) --- */
    #intro-layer {
        position: absolute; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        pointer-events: none; /* Let clicks pass to canvas for blackhole */
        transition: opacity 1s ease;
    }
    #intro-layer.hidden { opacity: 0; pointer-events: none; }

    .intro-text {
        font-family: 'Orbitron'; letter-spacing: 4px; color: rgba(255,255,255,0.7);
        text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
        animation: pulse 3s infinite;
    }
    .intro-sub { font-family: 'JetBrains Mono'; font-size: 0.8rem; color: #555; margin-top: 10px; }

    /* --- 5. 星球档案层 (优化横向滚动) --- */
    #archive-layer {
            position: absolute; inset: 0; z-index: 5;
            display: flex; align-items: center; 
            opacity: 0; pointer-events: none; transform: scale(1.1);
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden; /* 防止页面级滚动 */
        }
        #archive-layer.visible { opacity: 1; pointer-events: auto; transform: scale(1); }

        .planet-scroll-container {
            display: flex; gap: 80px; padding: 0 50vw 0 10vw; /* 左右留白，方便滚动开始和结束 */
            overflow-x: auto; 
            width: 100%; 
            height: 60vh; /* 限制高度，垂直居中 */
            align-items: center;
            
            /* 隐藏默认滚动条 */
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none;  /* IE 10+ */
            
            /* 关键：使用 mask 实现两侧淡入淡出效果 */
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .planet-scroll-container::-webkit-scrollbar { display: none; /* Chrome/Safari */ }

        /* 星球样式 */
        .planet-wrapper {
            flex-shrink: 0; /* 防止星球被压缩 */
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            transition: transform 0.3s; position: relative;
        }
        .planet-wrapper:hover { transform: translateY(-10px) scale(1.05); }

        .planet {
            width: 140px; height: 140px;
            border-radius: 50%;
            position: relative;
            /* 移除 background: radial-gradient... */
            background: black; /* 宇宙背景 */
            box-shadow: 0 0 20px rgba(0,0,0,0.5); /* 基础阴影 */
            transition: all 0.5s ease;
            overflow: hidden; /* 确保 Canvas 不溢出圆角 */
        }
        .planet canvas {
            width: 100%; height: 100%;
            display: block;
        }

        /* 悬停效果调整 */
        .planet:hover { 
            box-shadow: 0 0 50px var(--glow-color); 
            transform: scale(1.05); /* 轻微放大 */
        }
        .planet::after { display: none; }
        .planet:hover::after { opacity: 1; transform: scale(1.2); border-color: var(--glow-color); }

        .orbit-ring {
            position: absolute; width: 220px; height: 80px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 50%;
            top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg);
            pointer-events: none; transition: 0.3s;
        }
        .planet-wrapper:hover .orbit-ring { border-color: rgba(255,255,255,0.4); transform: translate(-50%, -50%) rotate(0deg); }

        .planet-label {
            font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 1px;
            text-shadow: 0 2px 4px black; opacity: 0.7; transition: 0.3s;
            margin-top: 20px;
        }
        .planet-wrapper:hover .planet-label { opacity: 1; color: var(--primary); letter-spacing: 2px; }

        /* --- 6. 弹窗 (滚动条美化) --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: rgba(15, 20, 30, 0.95); border: 1px solid var(--primary);
            width: 700px; max-width: 90vw; max-height: 80vh;
            border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15);
            transform: scale(0.9); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-overlay.open .modal-card { transform: scale(1); }

        .modal-header {
            padding: 20px 30px; background: rgba(0, 243, 255, 0.05);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-between; align-items: center;
        }
        /* 滚动容器 */
        .modal-scroll-area { 
            position: relative; flex: 1; overflow: hidden; display: flex;
        }
        /* 隐藏原生滚动条的类 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .modal-body { 
            padding: 30px; 
            overflow-y: auto; 
            color: #ccc; font-family: 'JetBrains Mono'; line-height: 1.8; font-size: 0.9rem;
        }

        /* --- 核心修复：自定义滚动条样式 --- */
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .modal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: var(--primary); }

        .close-btn { transition: 0.2s; }
        .close-btn:hover { color: var(--danger); transform: rotate(90deg); }

        /* --- [CSS 新增] 创世纪游戏样式 --- */
        #game-container {
            position: relative;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            border-radius: 8px;
        }

        #genesis-canvas {
            display: block; width: 100%; height: 100%;
        }

        .game-hud {
            position: absolute; pointer-events: none;
            display: flex; flex-direction: column; gap: 4px;
        }
        
        .hud-top-left { top: 20px; left: 20px; }
        .hud-bottom-right { bottom: 20px; right: 20px; text-align: right; }
        
        .hud-text {
            font-family: 'Orbitron'; font-size: 0.8rem; color: var(--primary);
            text-shadow: 0 0 5px var(--primary); letter-spacing: 1px;
        }
        .hud-sub { font-family: 'JetBrains Mono'; font-size: 0.7rem; color: #666; }
        
        .control-panel {
            position: absolute; bottom: 20px; left: 20px;
            pointer-events: auto; display: flex; gap: 10px;
        }
        
        .game-btn {
            background: rgba(0, 243, 255, 0.1); border: 1px solid var(--primary);
            color: var(--primary); padding: 5px 10px; font-size: 0.7rem; font-family: 'Orbitron';
            cursor: none; transition: 0.2s;
        }
        .game-btn:hover { background: var(--primary); color: black; box-shadow: 0 0 10px var(--primary); }

        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .animate-spin-slow {
            animation: spin-slow 10s linear infinite;
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        

</style>
</head> 
<body>
<!-- 1. Galaxy Canvas (The Lid & The Background) -->
<canvas id="galaxy-canvas"></canvas>
<div id="cursor"></div>

<!-- 2. Intro Layer (Initial State) -->
<div id="intro-layer">
    <h1 class="intro-text text-4xl"></h1>
    <p class="intro-sub"></p>
    <p class="text-[10px] text-gray-600 mt-2"></p>
</div>

<!-- 3. Navbar (Hidden initially) -->
<nav id="system-navbar" class="fixed top-0 left-0 w-full h-14 z-[50] flex items-center justify-between px-6 border-b border-cyan-500/30 bg-[#050505]/90 backdrop-blur-md">
    <div class="flex items-center gap-4">
        <div class="w-8 h-8 rounded border border-cyan-500/50 flex items-center justify-center bg-cyan-500/10">
            <i class="fas fa-atom text-cyan-400 text-sm"></i>
        </div>
        <div class="flex flex-col">
            <span class="font-orbitron text-[10px] text-cyan-400 tracking-widest">我还在</span>

        </div>

    <div class="hidden md:flex items-center gap-12 absolute left-1/2 transform -translate-x-1/2">

</div>

<!-- 5. Modals -->

<!-- Document View Modal -->
<div id="view-modal" class="modal-overlay">
    <div class="modal-card">
        <div class="modal-header">
            <div class="flex flex-col">
                <h2 class="text-xl font-orbitron text-white" id="modal-title">TITLE</h2>

            <i class="fas fa-times text-xl close-btn hover-trigger" onclick="closeModal('view')"></i>
        </div>
        <div class="modal-body" id="modal-content">
            <!-- Content injected here -->
        </div>
        <div class="p-4 border-t border-white/10 flex justify-end">
            
        </div>

</div>

<!-- 6. Genesis Game Modal (原 Add Modal) -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-card" style="width: 800px; height: 600px;">
            <div class="modal-header">
                <div class="flex items-center gap-2">
                    <i class="fas fa-dna text-purple-400"></i>
                    <h2 class="text-xl font-orbitron text-purple-400">粒子模拟</h2>
                </div>
                <i class="fas fa-times text-xl close-btn hover-trigger" onclick="stopGame(); closeModal('add')"></i>
            </div>
            
            <!-- 游戏区域 -->
            <div class="modal-body p-0 overflow-hidden relative" style="flex: 1;">
                <div id="game-container">
                    <canvas id="genesis-canvas"></canvas>
                    
                    <!-- 游戏 HUD -->
                    <div class="game-hud hud-top-left">
                        <div class="hud-text">模拟运行中...</div>
                        <div class="hud-sub">纪元: <span id="sim-epoch">0</span></div>
                        <div class="hud-sub">实体: <span id="sim-count">0</span></div>
                    </div>

                    <div class="game-hud hud-bottom-right">
                        <div class="hud-text" id="sim-status">稳定</div>
                        <div class="hud-sub">熵水平</div>
                    </div>

                    <!-- 控制按钮 -->
                    <div class="control-panel">
                        <button class="game-btn hover-trigger" onclick="resetSimulation()">重启</button>
                        <button class="game-btn hover-trigger" onclick="mutateRules()">变更规则</button>
                    </div>
                </div>
            </div>
            
            <div class="p-2 border-t border-white/10 bg-black/40 flex justify-between items-center px-4">
                <span class="text-[10px] text-gray-500 font-mono">> 观察人工智能生命的自主演化。红色=捕食者，绿色=资源，蓝色=守护者。</span>
                <span class="text-[10px] text-purple-400 font-mono animate-pulse">● 记录数据...</span>
            </div>
        </div>
    </div>
<script>
    // --- 1. Canvas Galaxy Engine ---
    const canvas = document.getElementById('galaxy-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, centerX, centerY;
    
    let stars = [];
    let isOpened = false; // State: Closed (Intro) or Opened (Archive)
    let animationFrame;

    // Configuration
    const STAR_COUNT = 800;
    const BLACKHOLE_RADIUS = 60; 

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
        centerX = width / 2;
        centerY = height / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    class Star {
        constructor() {
            this.reset();
            // Pre-warm position to form a disk
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.random() * (Math.max(width, height) / 1.5) + BLACKHOLE_RADIUS;
        }

        reset() {
            this.x = Math.random() * width;
            this.y = Math.random() * height;
            this.z = Math.random() * 2; // Depth
            this.size = Math.random() * 1.5;
            this.angle = Math.random() * Math.PI * 2;
            this.radius = Math.random() * (Math.max(width, height) / 1.5) + BLACKHOLE_RADIUS;
            this.speed = (Math.random() * 0.002) + 0.0005;
            this.color = Math.random() > 0.7 ? '#bc13fe' : '#00f3ff';
        }

        update() {
            if (!isOpened) {
                // Spiral Mode (Intro)
                this.angle += this.speed;
                this.radius -= 0.1; // Slowly spiral in
                
                if (this.radius < BLACKHOLE_RADIUS) {
                    this.radius = Math.max(width, height) / 1.5; // Reset to outer rim
                }

                this.x = centerX + Math.cos(this.angle) * this.radius;
                this.y = centerY + Math.sin(this.angle) * this.radius * 0.4; // 0.4 makes it an oval/disk
            } else {
                // Warp/Background Mode (Opened)
                // Move stars outward or just drift
                this.x += (this.x - centerX) * 0.005;
                this.y += (this.y - centerY) * 0.005;
                
                // Reset if out of bounds
                if (this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                }
            }
        }

        draw() {
            const alpha = isOpened ? 0.3 : (this.radius - BLACKHOLE_RADIUS) / 200; // Fade near blackhole
            ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function initStars() {
        stars = [];
        for(let i=0; i<STAR_COUNT; i++) stars.push(new Star());
    }

    function render() {
        // Trail effect
        ctx.fillStyle = 'rgba(5, 5, 5, 0.2)';
        ctx.fillRect(0, 0, width, height);

        // Draw Blackhole (Intro Only)
        if (!isOpened) {
            ctx.beginPath();
            ctx.arc(centerX, centerY, BLACKHOLE_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = 'black';
            ctx.fill();
            
            // Accretion Disk Glow
            ctx.shadowBlur = 20;
            ctx.shadowColor = 'white';
            ctx.strokeStyle = 'rgba(255,255,255,0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        stars.forEach(star => {
            star.update();
            star.draw();
        });

        animationFrame = requestAnimationFrame(render);
    }

    initStars();
    render();

    // --- 2. Interaction Logic (The "Opening") ---
    
    function openArchive() {
        if(isOpened) return;
        isOpened = true;

        // 1. UI Transitions
        document.getElementById('intro-layer').classList.add('hidden');
        
        // 2. Warp Effect Logic (Speed up stars momentarily - simulated by update logic change)
        
        setTimeout(() => {
            document.getElementById('system-navbar').classList.add('visible');
            document.getElementById('archive-layer').classList.add('visible');
        }, 800);
    }

    // Blackhole Click Detection
    canvas.addEventListener('click', (e) => {
        if(isOpened) return;
        const dx = e.clientX - centerX;
        const dy = e.clientY - centerY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        
        if (dist < BLACKHOLE_RADIUS + 20) {
            openArchive();
            l2d();
        }
    });

    // --- 3. Archive Data & Rendering (Planets) ---
// --- [JS 新增] 程序化星球生成器 ---
class PlanetGenerator {
            constructor() {
                this.palettes = [
                    { name: 'Earth', water: '#2a5b8c', land: ['#4a7f50', '#3a6a40', '#9a8f6d'], cloud: 'rgba(255,255,255,0.5)', atmosphere: '#4facfe' },
                    { name: 'Mars', water: '#8d3e3e', land: ['#ac5b4e', '#d57d6e', '#793222'], cloud: 'rgba(200,150,150,0.3)', atmosphere: '#ff5e62' },
                    { name: 'Ice', water: '#b1d4ff', land: ['#d2f9ff', '#f0e3fc', '#ffffff'], cloud: 'rgba(255,255,255,0.7)', atmosphere: '#c2e9fb' },
                    { name: 'Gas', water: '#4b2075', land: ['#85a7ee', '#6d4c92', '#220033'], cloud: 'rgba(100,255,218,0.2)', atmosphere: '#7597de' },
                    { name: 'Toxic', water: '#1f4037', land: ['#305a63', '#3c7384', '#00ffaa'], cloud: 'rgba(50,255,50,0.3)', atmosphere: '#00ff9d' },
                    { name: 'Lava', water: '#430b6d', land: ['#ec6343', '#ff2854', '#ffc1a9'], cloud: 'rgba(255,100,50,0.4)', atmosphere: '#ff0844' }
                ];
            }

            // 生成随机数
            rand(min, max) { return Math.random() * (max - min) + min; }

            // 绘制单个星球
            draw(canvas) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const r = w / 2;

                // 1. 随机选择色板
                const palette = this.palettes[Math.floor(Math.random() * this.palettes.length)];
                
                ctx.clearRect(0, 0, w, h);

                // --- 2. 绘制基础球体 (Base Sphere) ---
                // 核心修改：边缘不再是纯黑 (#000)，改为半透明黑，让颜色透出来
                const grad = ctx.createRadialGradient(cx - r/3, cy - r/3, 0, cx, cy, r);
                grad.addColorStop(0, palette.water);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)'); // 以前是 #000
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // 剪切区域
                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.clip();

                // --- 3. 绘制地貌 (Landmasses) ---
                const landCount = Math.floor(this.rand(10, 25));
                for(let i=0; i<landCount; i++) {
                    ctx.fillStyle = palette.land[Math.floor(Math.random() * palette.land.length)];
                    ctx.beginPath();
                    const lx = this.rand(0, w);
                    const ly = this.rand(0, h);
                    const lr = this.rand(10, 60); 
                    ctx.arc(lx, ly, lr, 0, Math.PI * 2);
                    ctx.fill();
                }

                // --- 4. 绘制云层 (Clouds) ---
                // 增加云层亮度和混合模式，使其看起来更像发光的大气
                ctx.globalCompositeOperation = 'screen'; // 让云层叠加变亮
                const cloudCount = Math.floor(this.rand(5, 12));
                ctx.fillStyle = palette.cloud;
                for(let i=0; i<cloudCount; i++) {
                    ctx.beginPath();
                    const cW = this.rand(20, w);
                    const cH = this.rand(5, 15);
                    const cX = this.rand(0, w);
                    const cY = this.rand(0, h);
                    ctx.ellipse(cX, cY, cW, cH, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over'; // 恢复正常混合模式
                ctx.restore(); // 取消剪切

                // --- 5. 绘制光照与阴影 (Lighting) ---
                // 核心修改：大幅减弱阴影浓度，增加通透感
                const shadowGrad = ctx.createRadialGradient(cx - r/2.5, cy - r/2.5, r/3, cx, cy, r);
                shadowGrad.addColorStop(0, 'transparent');
                shadowGrad.addColorStop(0.7, 'rgba(0,0,0,0.1)'); // 阴影开始得更晚，且更淡
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0.7)');   // 边缘阴影也不要全黑
                
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                // --- 6. 高光 (Highlight) ---
                // 增强高光，模拟大气层反光
                const highlightGrad = ctx.createRadialGradient(cx - r/3, cy - r/3, 0, cx - r/3, cy - r/3, r/2);
                highlightGrad.addColorStop(0, 'rgba(255,255,255,0.4)'); // 更亮的核心
                highlightGrad.addColorStop(1, 'transparent');

                ctx.fillStyle = highlightGrad;
                ctx.beginPath();
                ctx.arc(cx - r/3, cy - r/3, r/2, 0, Math.PI * 2);
                ctx.fill();

                // 边缘大气辉光 (Inner Rim Light)
                ctx.strokeStyle = palette.atmosphere;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                return palette.atmosphere; 
            }
        }

    function textToHtml(text) {

    // --- 5. Cursor Logic (修复：互动状态显示与输入状态) ---

        // --- [JS 修改] 创世纪：粒子生命模拟 (优化版) ---
        const gameCanvas = document.getElementById('genesis-canvas');
        const gameCtx = gameCanvas.getContext('2d');
        let gameReq;
        let particlesGame = [];
        let ruleMatrix = {}; 
        const RED = '#ff2a2a';
        const GREEN = '#00ff9d';
        const BLUE = '#00f3ff';
        const WHITE = '#ffffff';
        const colors = [RED, GREEN, BLUE, WHITE]; 
        // [新增] 鼠标交互变量
        const mouse = { x: 0, y: 0, active: false };

        // [新增] 监听鼠标在画布上的移动
        gameCanvas.addEventListener('mousemove', (e) => {
            // 获取鼠标在 Canvas 内部的坐标
            const rect = gameCanvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
            mouse.active = true;
        });

        // 鼠标离开画布时，停止交互
        gameCanvas.addEventListener('mouseleave', () => {
            mouse.active = false;
        });
        // 配置参数
        let atomCount = 600; // 初始数量
        const MAX_ATOMS = 800; // 最大数量限制
        const MIN_ATOMS = 400; // 最小数量限制
        const MAX_SPEED = 2.0; // 最大速度限制 (防止粒子乱飞)
        const FRICTION = 0.85; // 摩擦力 (越接近1越滑，越小停得越快。0.85比之前的0.5更顺滑)
        const FORCE_SCALE = 0.2; // 引力强度 (越小越慢)
        
        let epoch = 0;

        class Atom {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = 0; this.vy = 0;
                this.color = color;
                
                this.dead = false; // 死亡标记
                this.age = 0;      // 蓝色粒子用：年龄
                this.hp = 100;     // 红色粒子用：生命值 (用于承受蓝色攻击)
            }
        }


        function randomRules() {
            for (let i = 0; i < colors.length; i++) {
                for (let j = 0; j < colors.length; j++) {
                    ruleMatrix[`${colors[i]}-${colors[j]}`] = (Math.random() * 2 - 1);
                }
            }
            const status = document.getElementById('sim-status');
            if(status) {
                status.innerText = "RULES_MUTATED";
                status.style.color = "#bc13fe";
                setTimeout(() => {
                    status.innerText = "STABLE";
                    status.style.color = "var(--primary)";
                }, 1000);
            }
        }

        function createAtoms(count = atomCount) {
            particlesGame = [];
            for (let i = 0; i < count; i++) {
                addParticle();
            }
            updateCountDisplay();
        }

        function addParticle() {
            particlesGame.push(new Atom(
                Math.random() * gameCanvas.width,
                Math.random() * gameCanvas.height,
                colors[Math.floor(Math.random() * colors.length)]
            ));
        }

        function removeParticle() {
            if (particlesGame.length > 0) {
                // 随机移除一个，模拟自然死亡
                const idx = Math.floor(Math.random() * particlesGame.length);
                particlesGame.splice(idx, 1);
            }
        }

        function updateCountDisplay() {
            const el = document.getElementById('sim-count');
            if(el) el.innerText = particlesGame.length;
        }

        // --- [JS 修改] 核心物理引擎 (包含鼠标交互) ---
        function updateAtoms() {
            for (let i = 0; i < particlesGame.length; i++) {
                const a = particlesGame[i];
                if (a.dead) continue; // 跳过已死亡粒子

                let fx = 0; let fy = 0;
                
                // --- 生命逻辑 ---
                // 蓝色粒子：随时间自然死亡 (寿命约 600 帧，即 10秒左右)
                if (a.color === BLUE) {
                    a.age++;
                    if (a.age > 600) { a.dead = true; continue; }
                }

                // --- 交互逻辑 ---
                for (let j = 0; j < particlesGame.length; j++) {
                    if (i === j) continue;
                    const b = particlesGame[j];
                    if (b.dead) continue;
                    
                    const g = ruleMatrix[`${a.color}-${b.color}`];
                    let dx = a.x - b.x;
                    let dy = a.y - b.y;
                    let d = Math.sqrt(dx * dx + dy * dy);
                    
                    if (d > 0 && d < 100) {
                        // A. 物理力场
                        let F = 0;
                        if (d < 10) {
                            // [修改点] 同色斥力：只有相同颜色的粒子才会有强力排斥，避免重叠
                            // 不同颜色的粒子可以重叠（方便捕食/结合）
                            if (a.color === b.color) {
                                F = (10 - d) * 0.1; // 强斥力
                            } else {
                                // 异色粒子近距离几乎没有斥力，允许接触
                                F = 0; 
                            }
                        } else {
                            // 正常规则引力 (远距离)
                            F = (g * FORCE_SCALE) / d;
                        }
                        fx += (F * dx);
                        fy += (F * dy);

                        // B. 捕食与攻击逻辑 (接触判定 d < 10)
                        if (d < 10) {
                            // 规则1: 红吃绿
                            if (a.color === RED && b.color === GREEN) {
                                b.dead = true; // 绿色瞬间死亡
                                // 红色由于进食，可能会获得某种增益，这里暂不处理
                            }
                            
                            // 规则2: 蓝打红
                            if (a.color === BLUE && b.color === RED) {
                                // 接触时红色持续掉血
                                b.hp -= 5; 
                                if (b.hp <= 0) {
                                    b.dead = true; // 红色血量耗尽死亡
                                }
                            }
                        }
                    }
                }

                // 2. [新增] 鼠标交互力场
                if (mouse.active) {
                    let mdx = a.x - mouse.x;
                    let mdy = a.y - mouse.y;
                    let md = Math.sqrt(mdx * mdx + mdy * mdy);

                    // 鼠标影响半径为 150px
                    if (md < 150) {
                        // 这是一个斥力场，距离越近斥力越大
                        // 这里的 2.0 是斥力强度系数，你可以调整它来改变鼠标的“推力”
                        let mForce = (150 - md) * 0.02; 
                        
                        // 将粒子推开
                        fx += (mdx / md) * mForce;
                        fy += (mdy / md) * mForce;
                    }
                }
                
                // 应用物理
                a.vx = (a.vx + fx) * FRICTION;
                a.vy = (a.vy + fy) * FRICTION;
                
                // 速度限制
                const speed = Math.sqrt(a.vx*a.vx + a.vy*a.vy);
                if (speed > MAX_SPEED) {
                    const ratio = MAX_SPEED / speed;
                    a.vx *= ratio;
                    a.vy *= ratio;
                }

                a.x += a.vx;
                a.y += a.vy;

                // 边界反弹
                if (a.x <= 0 || a.x >= gameCanvas.width) a.vx *= -1;
                if (a.y <= 0 || a.y >= gameCanvas.height) a.vy *= -1;
                a.x = Math.max(0, Math.min(gameCanvas.width, a.x));
                a.y = Math.max(0, Math.min(gameCanvas.height, a.y));
            }
        }

        function drawGame() {
            // 1. 拖尾效果：加深透明度，让拖尾更短一点，画面更清晰
            gameCtx.fillStyle = 'rgba(0, 0, 0, 0.3)'; 
            gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            // 清理死亡粒子 (过滤掉 dead 为 true 的)
            // 这是一个简单的优化，防止数组无限膨胀
            if (epoch % 5 === 0) {
                particlesGame = particlesGame.filter(p => !p.dead);
            }
            // 2. 绘制粒子
            for (let i = 0; i < particlesGame.length; i++) {
                const a = particlesGame[i];
                gameCtx.fillStyle = a.color;
                gameCtx.beginPath();
                // 稍微画小一点，显得更精致
                gameCtx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
                gameCtx.fill();
            }
            
            updateAtoms();
            
            // --- [修改点] 自动生成逻辑 ---
            // 尝试生成新生命，维持生态
            // 如果某颜色太多，则停止生成该颜色，防止爆满
            if (epoch % 2 === 0 && particlesGame.length < MAX_ATOMS) {
                const spawnColor = colors[Math.floor(Math.random() * 3)]; // 只生成 红、绿、蓝
                // 只有当总数小于上限时才生成
                particlesGame.push(new Atom(
                    Math.random() * gameCanvas.width,
                    Math.random() * gameCanvas.height,
                    spawnColor
                ));
            }
            
            updateCountDisplay();

            epoch++;
            if(epoch % 10 === 0) {
                const epEl = document.getElementById('sim-epoch');
                if(epEl) epEl.innerText = epoch;
            }
            
            gameReq = requestAnimationFrame(drawGame);
        }

        function initGame() {
            const container = document.getElementById('game-container');
            // 设置画布分辨率，防止模糊
            gameCanvas.width = container.clientWidth;
            gameCanvas.height = container.clientHeight;
            
            randomRules();
            createAtoms(600); // 初始600
            epoch = 0;
            if (gameReq) cancelAnimationFrame(gameReq);
            drawGame();
        }

        function stopGame() {
            if (gameReq) cancelAnimationFrame(gameReq);
        }

        function resetSimulation() {
            createAtoms();
            epoch = 0;
        }

        function mutateRules() {
            randomRules();
        }

        // 找到原来的 openModal 函数，修改为：
