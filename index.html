<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无限视界</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/x-icon" href="favicon.ico"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Noto+Sans+SC:wght@300;500;700&display=swap');

        :root {
            --primary: #00f3ff;
            --secondary: #bc13fe;
            --danger: #ff2a2a;
            --bg-color: #050505;
        }
        /* 强制所有元素（包括输入框、按钮、链接）都不显示原生光标 */
        *, *::before, *::after {
            cursor: none !important;
        }

        body {
            background-color: var(--bg-color);
            color: white;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
            cursor: none; /* Hide default cursor */
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* --- Custom Cursor --- */
        #cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 20px;
            height: 20px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 9999;
            transition: width 0.2s, height 0.2s, background-color 0.2s;
            mix-blend-mode: difference;
        }
        
        #cursor.hovered {
            width: 40px;
            height: 40px;
            background-color: rgba(0, 243, 255, 0.2);
            border-color: var(--secondary);
        }

        #cursor.blackhole-hover {
            width: 80px;
            height: 80px;
            border-color: white;
            background-color: rgba(255,255,255,0.1);
            mix-blend-mode: normal;
        }

        #cursor.enemy-hover {
            border-color: var(--danger);
            background-color: rgba(255, 42, 42, 0.2);
        }
        /* 输入状态下的鼠标样式 */
        #cursor.text-mode { width: 4px; height: 20px; border-radius: 2px; background-color: var(--primary); border: none; mix-blend-mode: normal; }

        /* --- Background Canvas --- */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* --- Card Styles (Base) --- */
        .card-container {
            perspective: 1000px;
            transform-style: preserve-3d;
            
            /* 使用 clamp 实现响应式宽度：最小240px，首选22vw，最大340px */
            /* 这样在小屏幕不至于太小，大屏幕不至于太大 */
            width: clamp(200px, 22vw, 280px);
            
            /* 保持固定的纵横比 (5:8)，高度会自动计算 */
            aspect-ratio: 5 / 8;
            
            position: relative;
        }
        .game-card, .enemy-card {
            width: 100%; /* 改为100%继承容器宽度 */
            aspect-ratio: 5 / 8; /* 改为100%继承容器高度 */
            border-radius: 15px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out, box-shadow 0.3s;
            backdrop-filter: blur(10px);
            overflow: hidden;
        }

        /* Player Card Specifics */
        .game-card {
            background: rgba(20, 20, 35, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* Enemy Card Specifics */
        .enemy-card {
            background: rgba(40, 10, 10, 0.85);
            border: 1px solid rgba(255, 42, 42, 0.4);
            box-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
        }

        .card-content {
            position: absolute;
            inset: 4px;
            background: rgba(10, 10, 12, 0.95);
            border-radius: 12px;
            z-index: 2;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 新增：防止内容溢出时出现滚动条（可选，也可加overflow-y: auto） */
            box-sizing: border-box;
        }
        /* 卡片标题 */
        .card-content h2 {
            font-size: clamp(0.9rem, 1.8vw, 1.2rem); /* 小屏0.9rem，大屏最大1.2rem */
            font-weight: bold;
            font-family: 'Orbitron', sans-serif;
            line-height: 1.2; /* 行高适配，避免换行异常 */
            margin-bottom: 0.25rem;
        }
        .card-content p {
            font-size: clamp(0.65rem, 1.2vw, 0.8rem);
        }
        /* 卡片描述文本 */
        .card-content .text-gray-400 {
            font-size: clamp(0.55rem, 0.9vw, 0.7rem);
            line-height: 1.4; /* 增加行高，小屏更易读 */
        }

        /* 属性值（ATK/DEF数值） */
        .card-content .text-red-400, .card-content .text-blue-400 {
            font-size: clamp(0.6rem, 1vw, 0.75rem);
        }

        /* 激活技能按钮文字 */
        .glowing-btn {
            font-size: clamp(0.65rem, 1.1vw, 0.8rem);
            padding: clamp(0.5rem, 1vw, 0.75rem) 0; /* 按钮内边距也适配 */
        }
        /* 卡片内图片容器 */
        .card-content > div:first-child {
            /* 保持图片区域占卡片高度的50%，适配不同尺寸卡片 */
            height: 50%;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        /* 图片自适应 */
        .card-content img {
            width: 100%;
            height: 100%;
            
        }   

        .card-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid var(--primary);
            border-radius: 15px;
            z-index: 10;
            pointer-events: none;
            opacity: 0.6;
        }

        .enemy-card .card-frame {
            border-color: var(--danger);
        }

        /* Holographic Sheen */
        .holo-overlay {
            position: absolute;
            inset: 0;
            border-radius: 15px;
            z-index: 20;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        .game-card .holo-overlay {
            background: linear-gradient(105deg, transparent 20%, rgba(255, 255, 255, 0.1) 25%, transparent 40%, rgba(0, 243, 255, 0.2) 45%, transparent 50%);
        }

        .enemy-card .holo-overlay {
            background: linear-gradient(105deg, transparent 20%, rgba(255, 100, 100, 0.1) 25%, transparent 40%, rgba(255, 0, 0, 0.2) 45%, transparent 50%);
        }

        .game-card:hover .holo-overlay, .enemy-card:hover .holo-overlay {
            opacity: 1;
        }

        /* Animations */
        @keyframes attack-lunge {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(100px) scale(1.1) rotate(5deg); }
            100% { transform: translateX(0) scale(1); }
        }

        @keyframes damage-shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-10px) rotate(-5deg); filter: brightness(2) sepia(1) hue-rotate(-50deg) saturate(5); }
            50% { transform: translateX(10px) rotate(5deg); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); filter: none; }
        }

        @keyframes cardEnter {
            from { transform: translateY(50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .card-enter { animation: cardEnter 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-attack { animation: attack-lunge 0.3s ease-in-out; }
        .animate-damage { animation: damage-shake 0.4s ease-in-out; }

        /* Glitch Text */
        .glitch-text { position: relative; font-family: 'Orbitron', sans-serif; }
        .glitch-text::before, .glitch-text::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color);
        }
        .glitch-text::before { left: 2px; text-shadow: -1px 0 #ff00c1; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim 5s infinite linear alternate-reverse; }
        .glitch-text::after { left: -2px; text-shadow: -1px 0 #00fff9; clip: rect(44px, 450px, 56px, 0); animation: glitch-anim2 5s infinite linear alternate-reverse; }
        @keyframes glitch-anim { 0% { clip: rect(14px, 9999px, 127px, 0); } 100% { clip: rect(40px, 9999px, 80px, 0); } }
        @keyframes glitch-anim2 { 0% { clip: rect(32px, 9999px, 4px, 0); } 100% { clip: rect(80px, 9999px, 40px, 0); } }

        /* UI Elements */
        .hud-bar {
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(8px);
        }

        .glowing-btn {
            box-shadow: 0 0 10px var(--primary);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .glowing-btn:hover {
            box-shadow: 0 0 20px var(--primary), 0 0 40px var(--secondary);
        }
        .glowing-btn:active { transform: scale(0.95); }
        .glowing-btn:disabled { filter: grayscale(1); cursor: not-allowed; box-shadow: none; opacity: 0.5; }

        /* Battle Log */
        #battle-log {
            width: 100%;
            height: 180px;
            background: rgba(5, 5, 10, 0.8);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 8px;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column-reverse; /* Newest at bottom visually if needed, but we prepend usually */
        }
        
        #battle-log::-webkit-scrollbar { width: 4px; }
        #battle-log::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 2px; }

        .log-entry { margin-bottom: 4px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.05); animation: fadeIn 0.3s forwards; }
        .log-entry.player-action { color: var(--primary); }
        .log-entry.enemy-action { color: var(--danger); }
        .log-entry.system { color: #888; font-style: italic; }
        .log-entry.victory { color: #4ade80; font-weight: bold; text-shadow: 0 0 5px #4ade80; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

        /* Stats Bars */
        .stat-bar-container { background: rgba(255,255,255,0.1); border-radius: 4px; height: 10px; overflow: hidden; position: relative; }
        .stat-bar-fill { height: 100%; transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        
        /* Floating Damage Text */
        .damage-text {
            position: fixed;
            color: red;
            font-weight: bold;
            font-family: 'Orbitron';
            font-size: 2rem;
            pointer-events: none;
            animation: floatUp 1s forwards;
            z-index: 9999;
            text-shadow: 0 0 5px black;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
        /* --- Navbar Specific Styles --- */
        .nav-link {
            position: relative;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: #555;
            text-decoration: none;
            padding: 5px 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .nav-link .nav-icon {
            font-size: 0.7rem;
            opacity: 0;
            transform: translateX(-5px);
            transition: all 0.3s;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--primary);
            text-shadow: 0 0 8px rgba(0, 243, 255, 0.5);
        }

        .nav-link:hover .nav-icon, .nav-link.active .nav-icon {
            opacity: 1;
            transform: translateX(0);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--primary);
            box-shadow: 0 0 10px var(--primary);
            transition: all 0.3s;
            transform: translateX(-50%);
        }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .page-section { display: none; }
        .page-section.active { display: block; }
        #archive-section.active {
            position: fixed;
            inset: 0;
            z-index: 8;
            pointer-events: none;
        }
        #galaxy-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            display: none;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .intro-text {
            font-family: 'Orbitron';
            letter-spacing: 4px;
            color: rgba(255,255,255,0.7);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            animation: pulse 3s infinite;
        }

        .intro-sub {
            font-family: 'JetBrains Mono';
            font-size: 0.8rem;
            color: #555;
            margin-top: 10px;
        }

        #intro-layer {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 1s ease;
        }

        #intro-layer.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #archive-section { position: absolute; inset: 0; z-index: 20; }
        #archive-layer {
            position: absolute; inset: 0; z-index: 7;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transform: scale(1.1);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        #archive-section.active #archive-layer.visible { opacity: 1; pointer-events: auto; transform: scale(1); }

        .nav-link:hover::after, .nav-link.active::after {
            width: 100%;
        }

        .shadow-blue-glow {
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.4);
        }

        .planet-scroll-container {
            display: flex; gap: 80px; padding: 0 50vw 0 10vw;
            overflow-x: auto; width: 100%; height: 60vh; align-items: center;
            scrollbar-width: none; -ms-overflow-style: none;
            mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        }
        .planet-scroll-container::-webkit-scrollbar { display: none; }
        .planet-wrapper { flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 20px; transition: transform 0.3s; position: relative; }
        .planet-wrapper:hover { transform: translateY(-10px) scale(1.05); }
        .planet { width: 140px; height: 140px; border-radius: 50%; position: relative; background: black; box-shadow: 0 0 20px rgba(0,0,0,0.5); transition: all 0.5s ease; overflow: hidden; }
        .planet canvas { width: 100%; height: 100%; display: block; }
        .planet:hover { box-shadow: 0 0 50px var(--glow-color); transform: scale(1.05); }
        .orbit-ring { position: absolute; width: 220px; height: 80px; border: 1px solid rgba(255,255,255,0.1); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-15deg); pointer-events: none; transition: 0.3s; }
        .planet-wrapper:hover .orbit-ring { border-color: rgba(255,255,255,0.4); transform: translate(-50%, -50%) rotate(0deg); }
        .planet-label { font-family: 'Orbitron'; font-size: 0.9rem; letter-spacing: 1px; text-shadow: 0 2px 4px black; opacity: 0.7; transition: 0.3s; margin-top: 20px; }
        .planet-wrapper:hover .planet-label { opacity: 1; color: var(--primary); letter-spacing: 2px; }
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 100; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-card {
            background: rgba(15, 20, 30, 0.95); border: 1px solid var(--primary);
            width: 700px; max-width: 90vw; max-height: 80vh; border-radius: 12px;
            box-shadow: 0 0 50px rgba(0, 243, 255, 0.15); transform: scale(0.9);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-overlay.open .modal-card { transform: scale(1); }
        .modal-header { padding: 20px 30px; background: rgba(0, 243, 255, 0.05); border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .modal-scroll-area { position: relative; flex: 1; overflow: hidden; display: flex; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .modal-body { padding: 30px; overflow-y: auto; color: #ccc; font-family: 'JetBrains Mono'; line-height: 1.8; font-size: 0.9rem; }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        .modal-body::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .modal-body::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        .close-btn { transition: 0.2s; }
        .close-btn:hover { color: var(--danger); transform: rotate(90deg); }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            border-radius: 8px;
        }

        #genesis-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .game-hud {
            position: absolute;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hud-top-left { top: 20px; left: 20px; }
        .hud-bottom-right { bottom: 20px; right: 20px; text-align: right; }

        .hud-text {
            font-family: 'Orbitron';
            font-size: 0.8rem;
            color: var(--primary);
            text-shadow: 0 0 5px var(--primary);
            letter-spacing: 1px;
        }

        .hud-sub {
            font-family: 'JetBrains Mono';
            font-size: 0.7rem;
            color: #666;
        }

        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            pointer-events: auto;
            display: flex;
            gap: 10px;
        }

        .game-btn {
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 5px 10px;
            font-size: 0.7rem;
            font-family: 'Orbitron';
            cursor: none;
            transition: 0.2s;
        }

        .game-btn:hover {
            background: var(--primary);
            color: black;
            box-shadow: 0 0 10px var(--primary);
        }

        .animate-spin-slow {
            animation: spin-slow 10s linear infinite;
        }

        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 极窄屏幕适配：768px以下改为上下分布 */
        @media (max-width: 768px) {
            /* 主游戏区域从水平flex改为垂直flex */
            .fixed.inset-0.flex.items-center.justify-center {
                flex-direction: column;
                padding: 0;
                overflow-y: auto; /* 允许垂直滚动，避免内容溢出 */
                padding-top: 850px; /* 避开顶部导航栏 */
                padding-bottom: 180px; /* 避开底部HUD */
            }

            /* 调整卡片容器的间距和位置 */
            .flex.flex-col.items-center.gap-4.relative.z-50 {
                margin: 0 !important; /* 移除左右margin */
                margin-bottom: 20px !important; /* 卡片之间增加底部间距 */
                width: 100%;
                align-items: center;
            }

            /* 核心修改：hud-bar完全竖向排列 */
    .hud-bar {
        flex-direction: column !important; /* 强制竖向 */
        gap: 12px !important; /* 增加元素间距 */
        justify-content: left;
        padding: 12px !important; /* 调整内边距 */
        align-items: stretch !important; /* 子元素拉伸占满宽度 */
    }
    /* hud-bar内部的分隔线调整 */
    .hud-bar .h-8.w-1.bg-gray-600 {
        width: 100% !important; /* 宽度拉满 */
        height: 1px !important; /* 改为横线 */
        background-color: #444 !important;
        margin: 4px 0 !important;
    }
    /* 操作按钮区域调整为横向排列（在竖向HUD内更合理） */
    .hud-bar .flex.gap-4 {
        width: 100%;
        justify-content: center; /* 按钮居中 */
        gap: 20px !important; /* 增加按钮间距 */
        margin-top: 4px;
    }

            /* 卡片容器的最大宽度调整，适配窄屏 */
            .card-container {
                width: clamp(200px, 80vw, 280px); /* 窄屏占80vw，最大化利用宽度 */
            }

            /* 底部HUD适配，避免遮挡 */
            .fixed.bottom-0.w-full.p-6 {
                padding: 4px;
            }
            .hud-bar.px-8.py-4 {
                padding: 4px 8px;
                gap: 4px;
            }
            .w-48 {
                width: 30%; /* 缩小HP/能量条宽度，适配窄屏 */
            }

            /* 顶部HUD文字缩小，避免溢出 */
            .text-4xl {
                font-size: clamp(1.5rem, 5vw, 2rem);
            }
            .glitch-text {
                white-space: nowrap;
            }

            /* 战斗日志标题适配 */
            .text-center.font-orbitron.text-gray-400.text-xs {
                font-size: 0.6rem;
            }

            /* 浮动伤害文字缩小，适配窄屏 */
            .damage-text {
                font-size: clamp(1rem, 3vw, 1.5rem);
            }
        }
    </style>
    <script src="https://unpkg.com/oh-my-live2d@latest"></script>
</head>
<body>
    <div>
        <!-- Top Navigation Bar -->

    <script>
        // Mobile 设备也使用单页应用模式，避免页面间跳转。
        
        // --- GAME DATA (loaded from JSON) ---
        let projects = [], enemies = [];

        const CARD_COLORS = [
            'from-blue-500 to-indigo-600',
            'from-green-400 to-blue-500',
            'from-orange-400 to-red-600',
            'from-purple-500 to-pink-600',
            'from-cyan-400 to-teal-600',
            'from-yellow-400 to-orange-500',
            'from-red-600 to-orange-700',
            'from-blue-600 to-cyan-700'
        ];
        const ENEMY_COLORS = [
            'from-red-600 to-orange-700',
            'from-blue-600 to-cyan-700',
            'from-purple-600 to-pink-700',
            'from-rose-600 to-red-800'
        ];
        function randColor(palette) {
            return palette[Math.floor(Math.random() * palette.length)];
        }


        // --- GAME STATE ---
        let state = {
            playerHp: 100,
            maxPlayerHp: 100,
            playerMana: 10,
            maxPlayerMana: 10,
            cardIndex: 0,
            enemyIndex: 0,
            isPlayerTurn: true
        };
        let archiveOpened = false;
        const bgmAudio = document.getElementById('bgm-audio');
        const bgmTracks = [
            'Music/1.wav',
            'Music/2.wav',
            'Music/3.wav',
            'Music/4.wav',
            'Music/5.wav'
        ];
        let bgmStarted = false;

        function setupBackgroundMusic() {
            if (!bgmAudio) return;
            bgmAudio.volume = 0.08;
            bgmAudio.dataset.currentTrack = '';
            bgmAudio.src = bgmTracks[Math.floor(Math.random() * bgmTracks.length)];
            bgmAudio.dataset.currentTrack = bgmAudio.src;
            bgmAudio.addEventListener('ended', () => {
                let nextTrack = bgmAudio.dataset.currentTrack;
                while (bgmTracks.length > 1 && nextTrack === bgmAudio.dataset.currentTrack) {
                    nextTrack = bgmTracks[Math.floor(Math.random() * bgmTracks.length)];
                }
                bgmAudio.src = nextTrack;
                bgmAudio.dataset.currentTrack = nextTrack;
                bgmAudio.play().catch(() => {});
            });
        }

        function startBackgroundMusic() {
            if (!bgmAudio || bgmStarted) return;
            bgmStarted = true;
            bgmAudio.play().catch(() => {
                bgmStarted = false;
            });
        }

        // DOM Elements
        const el = {
            cardSlot: document.getElementById('active-card-slot'),
            enemySlot: document.getElementById('enemy-card-slot'),
            log: document.getElementById('battle-log'),
            hpText: document.getElementById('player-hp-text'),
            hpBar: document.getElementById('player-hp-bar'),
            manaText: document.getElementById('player-mana-text'),
            manaBar: document.getElementById('player-mana-bar'),
            enemyHpText: document.getElementById('enemy-hp-text'),
            enemyHpBar: document.getElementById('enemy-hp-bar'),
            prevBtn: document.getElementById('prev-btn'),
            nextBtn: document.getElementById('next-btn')
        };

        // --- RENDER FUNCTIONS ---

        function renderPlayerCard(index) {
            const p = projects[index];
            
            const html = `
                <div class="game-card card-enter hover-trigger" id="player-card">
                    <div class="card-frame"></div>
                    <div class="holo-overlay"></div>
                    <div class="card-content">
                        <!-- Image -->
                        
                        <div class="h-1/2 w-full relative overflow-hidden bg-black">
                            <a href="${p.link}">
                                <img src="${p.image}" class="object-cover w-full h-full opacity-80 hover:scale-110 transition-transform duration-700" alt="${p.title}">
                                <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[#0f0f13] to-transparent"></div>
                                <div class="absolute top-2 right-2 bg-black/60 backdrop-blur-md px-2 py-1 rounded border border-white/20 text-[10px] text-white font-mono">
                                    LV.${Math.ceil(p.attr.attack / 10)}
                                </div>
                            </a>
                            
                        </div>
                        
                        <!-- Details -->
                        <div class="p-4 flex flex-col h-1/2 justify-between relative z-10">
                            <div>
                                <h2 class="text-lg font-bold font-orbitron text-white leading-tight">${p.title}</h2>
                                <p class="text-[10px] text-cyan-400 font-mono mb-1">[ ${p.type} ]</p>
                                <p class="text-[10px] text-gray-400 leading-relaxed">${p.desc}</p>
                            </div>

                            <!-- Attributes -->
                            <div class="bg-black/30 p-1 rounded border border-white/5 mt-1 space-y-1">
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-gray-500 w-6">ATK</span>
                                    <div class="flex-1 h-1 bg-gray-700 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-red-500 to-orange-500" style="width: ${p.attr.attack}%"></div>
                                    </div>
                                    <span class="text-[10px] font-bold text-red-400">${p.attr.attack}</span>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="text-[10px] text-gray-500 w-6">DEF</span>
                                    <div class="flex-1 h-1 bg-gray-700 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-blue-500 to-cyan-500" style="width: ${p.attr.defense}%"></div>
                                    </div>
                                    <span class="text-[10px] font-bold text-blue-400">${p.attr.defense}</span>
                                </div>
                            </div>

                            <button onclick="playCard()" ${state.playerMana < p.attr.cost ? 'disabled' : ''} 
                                class="w-full mt-2 py-2 bg-gradient-to-r ${randColor(CARD_COLORS)} rounded text-xs font-bold text-white uppercase tracking-wider glowing-btn hover-trigger flex justify-between px-4 items-center">
                                <span>激活技能</span>
                                <span class="flex items-center gap-1 text-[10px]"><i class="fas fa-bolt text-yellow-300"></i> -${p.attr.cost}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            el.cardSlot.innerHTML = html;
            const card = document.getElementById('player-card');
            bindTiltEffect(card);
        }

        function renderEnemyCard() {
            const e = enemies[state.enemyIndex];
            
            const html = `
                <div class="enemy-card hover-trigger" id="active-enemy-card">
                    <div class="card-frame"></div>
                    <div class="holo-overlay"></div>
                    <div class="card-content">
                        <div class="h-1/2 w-full relative overflow-hidden bg-black">
                            <img src="${e.image}" class="object-cover w-full h-full opacity-80" style="filter: hue-rotate(-20deg) contrast(1.2);">
                            <div class="absolute bottom-0 left-0 w-full h-1/2 bg-gradient-to-t from-[#1a0505] to-transparent"></div>
                            <div class="absolute top-2 left-2 bg-red-900/80 backdrop-blur-md px-2 py-1 rounded border border-red-500/50 text-[10px] text-white font-mono">
                                THREAT LEVEL: EXTREME
                            </div>
                        </div>
                        
                        <div class="p-4 flex flex-col h-1/2 relative z-10">
                            <h2 class="text-xl font-bold font-orbitron text-red-500 mb-1">${e.title}</h2>
                            <p class="text-xs text-gray-400 mb-4">${e.desc}</p>
                            
                            <div class="mt-auto border-t border-red-900/50 pt-3">
                                <div class="flex justify-between text-xs text-red-300 mb-2">
                                    <span>攻击力</span>
                                    <span>${e.attack} / TURN</span>
                                </div>
                                <div class="text-[10px] text-gray-500 italic text-center">
                                    "小心，它正在吞噬你的时间..."
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            el.enemySlot.innerHTML = html;
            const card = document.getElementById('active-enemy-card');
            bindTiltEffect(card);
        }

        function updateUI() {
            // Player Stats
            el.hpText.innerText = `${state.playerHp}/${state.maxPlayerHp}`;
            el.hpBar.style.width = `${(state.playerHp / state.maxPlayerHp) * 100}%`;
            
            el.manaText.innerText = `${state.playerMana}/${state.maxPlayerMana}`;
            el.manaBar.style.width = `${(state.playerMana / state.maxPlayerMana) * 100}%`;

            // Enemy Stats
            const e = enemies[state.enemyIndex];
            el.enemyHpText.innerText = `${e.hp}/${e.maxHp}`;
            el.enemyHpBar.style.width = `${(e.hp / e.maxHp) * 100}%`;

            // Re-render player card to update button disabled state
            renderPlayerCard(state.cardIndex);
        }

        function log(msg, type = 'system') {
            const div = document.createElement('div');
            div.className = `log-entry system `;
            div.innerText = msg;
            el.log.prepend(div);
            // Limit log size
            if(el.log.children.length > 20) el.log.lastChild.remove();
        }

        // --- COMBAT LOGIC ---

        function showFloatingText(text, x, y, color = 'red') {
            const div = document.createElement('div');
            div.className = 'damage-text';
            div.style.left = x + 'px';
            div.style.top = y + 'px';
            div.style.color = color;
            div.innerText = text;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }

        function playCard() {
            if (!state.isPlayerTurn) return;
            const card = projects[state.cardIndex];
            const enemy = enemies[state.enemyIndex];

            if (state.playerMana < card.attr.cost) {
                log("能量不足！请休息。", "system");
                return;
            }

            state.isPlayerTurn = false;
            
            // 1. Pay Cost
            state.playerMana -= card.attr.cost;
            updateUI();

            // 2. Animation
            const pCardEl = document.getElementById('player-card');
            pCardEl.classList.add('animate-attack');
            setTimeout(() => pCardEl.classList.remove('animate-attack'), 300);

            // 3. Deal Damage
            setTimeout(() => {
                const damage = card.attr.attack;
                enemy.hp = Math.max(0, enemy.hp - damage);
                
                // Visuals
                const eCardEl = document.getElementById('active-enemy-card');
                eCardEl.classList.add('animate-damage');
                setTimeout(() => eCardEl.classList.remove('animate-damage'), 400);
                
                const rect = eCardEl.getBoundingClientRect();
                showFloatingText(`-`+damage, rect.left + 100, rect.top + 50);

                log(`使用了 ${card.title}，造成 ${damage} 点伤害！`, "player-action");
                updateUI();

                // Check Victory
                if (enemy.hp <= 0) {
                    log(`击败了 ${enemy.title}！获得成就感！`, "victory");
                    setTimeout(() => {
                        nextEnemy();
                    }, 1000);
                    state.isPlayerTurn = true;
                } else {
                    // Enemy Turn
                    setTimeout(enemyTurn, 1000);
                }
            }, 300);
        }

        function enemyTurn() {
            const enemy = enemies[state.enemyIndex];
            const pCard = projects[state.cardIndex];
            
            // Calculate damage (reduced by current card defense)
            let damage = Math.max(0, enemy.attack - Math.floor(pCard.attr.defense / 5)); // Simple defense formula
            
            state.playerHp = Math.max(0, state.playerHp - damage);
            
            // Visuals
            const pCardEl = document.getElementById('player-card');
            pCardEl.classList.add('animate-damage');
            setTimeout(() => pCardEl.classList.remove('animate-damage'), 400);
            
            const rect = pCardEl.getBoundingClientRect();
            showFloatingText(`-`+damage, rect.left + 100, rect.top + 50, 'purple');

            log(`${enemy.title} 发动攻击！你受到了 ${damage} 点伤害。`, "enemy-action");
            updateUI();

            if (state.playerHp <= 0) {
                log("你的意志力耗尽了... 请刷新重试。", "enemy-action");
                location.reload();
            } else {
                state.isPlayerTurn = true;
            }
        }

        function restAction() {
            if (!state.isPlayerTurn) return;
            state.playerMana = Math.min(state.maxPlayerMana, state.playerMana + 5);
            state.playerHp = Math.min(state.maxPlayerHp, state.playerHp + 10);
            log("你喝了一杯咖啡，回复了生命和能量。", "system");
            updateUI();
            
            state.isPlayerTurn = false;
            setTimeout(enemyTurn, 800);
        }

        function nextEnemy() {
            state.enemyIndex = (state.enemyIndex + 1) % enemies.length;
            // Reset Enemy HP logic if needed, here we keep persistent enemies or reset? 
            // Let's reset the new enemy HP for gameplay loop
            enemies[state.enemyIndex].hp = enemies[state.enemyIndex].maxHp; 
            
            renderEnemyCard();
            updateUI();
            log(`新的挑战出现了：${enemies[state.enemyIndex].title}`, "system");
            state.isPlayerTurn = true;
        }

        // --- INPUT HANDLING ---

        el.nextBtn.addEventListener('click', () => {
            if(state.playerMana<=0){return;}
            state.cardIndex = (state.cardIndex + 1) % projects.length;

                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;

                const rotateX = ((y - centerY) / centerY) * -10; 
                const rotateY = ((x - centerX) / centerX) * 10;

                card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.02)`;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2;
                this.speedX = (Math.random() - 0.5) * 0.5;
                this.speedY = (Math.random() - 0.5) * 0.5;
                this.color = Math.random() > 0.5 ? '#00f3ff' : '#bc13fe';
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = this.color; ctx.globalAlpha = 0.5; ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
                // Link lines
                particles.forEach(p2 => {
                    const dx = p.x - p2.x; const dy = p.y - p2.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 100) {
                        ctx.beginPath(); ctx.strokeStyle = 'rgba(100, 100, 255, 0.05)';
                        ctx.lineWidth = 0.5; ctx.moveTo(p.x, p.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
                    }
                });
            });
            requestAnimationFrame(animateParticles);
        }

        class ArchiveStar {
            constructor() {
                this.reset();
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * (Math.max(galaxyCanvas.width, galaxyCanvas.height) / 1.5) + BLACKHOLE_RADIUS;
            }

            reset() {
                this.x = Math.random() * galaxyCanvas.width;
                this.y = Math.random() * galaxyCanvas.height;
                this.size = Math.random() * 1.5;
                this.angle = Math.random() * Math.PI * 2;
                this.radius = Math.random() * (Math.max(galaxyCanvas.width, galaxyCanvas.height) / 1.5) + BLACKHOLE_RADIUS;
                this.speed = (Math.random() * 0.002) + 0.0005;
                this.color = Math.random() > 0.7 ? '#bc13fe' : '#00f3ff';
            }

            update() {
                if (!archiveOpened) {
                    this.angle += this.speed;
                    this.radius -= 0.1;

                    if (this.radius < BLACKHOLE_RADIUS) {
                        this.radius = Math.max(galaxyCanvas.width, galaxyCanvas.height) / 1.5;
                    }

                    this.x = galaxyCenterX + Math.cos(this.angle) * this.radius;
                    this.y = galaxyCenterY + Math.sin(this.angle) * this.radius * 0.4;
                } else {
                    this.x += (this.x - galaxyCenterX) * 0.005;
                    this.y += (this.y - galaxyCenterY) * 0.005;

                    if (this.x < 0 || this.x > galaxyCanvas.width || this.y < 0 || this.y > galaxyCanvas.height) {
                        this.x = Math.random() * galaxyCanvas.width;
                        this.y = Math.random() * galaxyCanvas.height;
                    }
                }
            }

            draw() {
                const alpha = archiveOpened ? 0.3 : (this.radius - BLACKHOLE_RADIUS) / 200;
                galaxyCtx.globalAlpha = Math.max(0, Math.min(1, alpha));
                galaxyCtx.fillStyle = this.color;
                galaxyCtx.beginPath();
                galaxyCtx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                galaxyCtx.fill();
            }
        }

        // --- Archive Section Logic ---
        class PlanetGenerator {
            constructor() {
                this.palettes = [
                    { name: 'Earth', water: '#2a5b8c', land: ['#4a7f50', '#3a6a40', '#9a8f6d'], cloud: 'rgba(255,255,255,0.5)', atmosphere: '#4facfe' },
                    { name: 'Mars', water: '#8d3e3e', land: ['#ac5b4e', '#d57d6e', '#793222'], cloud: 'rgba(200,150,150,0.3)', atmosphere: '#ff5e62' },
                    { name: 'Ice', water: '#b1d4ff', land: ['#d2f9ff', '#f0e3fc', '#ffffff'], cloud: 'rgba(255,255,255,0.7)', atmosphere: '#c2e9fb' },
                    { name: 'Gas', water: '#4b2075', land: ['#85a7ee', '#6d4c92', '#220033'], cloud: 'rgba(100,255,218,0.2)', atmosphere: '#7597de' },
                    { name: 'Toxic', water: '#1f4037', land: ['#305a63', '#3c7384', '#00ffaa'], cloud: 'rgba(50,255,50,0.3)', atmosphere: '#00ff9d' },
                    { name: 'Lava', water: '#430b6d', land: ['#ec6343', '#ff2854', '#ffc1a9'], cloud: 'rgba(255,100,50,0.4)', atmosphere: '#ff0844' }
                ];
            }

            rand(min, max) { return Math.random() * (max - min) + min; }

            draw(canvas) {
                const ctx = canvas.getContext('2d');
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const r = w / 2;
                const palette = this.palettes[Math.floor(Math.random() * this.palettes.length)];

                ctx.clearRect(0, 0, w, h);

                const grad = ctx.createRadialGradient(cx - r/3, cy - r/3, 0, cx, cy, r);
                grad.addColorStop(0, palette.water);
                grad.addColorStop(1, 'rgba(0, 0, 0, 0.4)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                ctx.save();
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.clip();

                const landCount = Math.floor(this.rand(10, 25));
                for (let i = 0; i < landCount; i++) {
                    ctx.fillStyle = palette.land[Math.floor(Math.random() * palette.land.length)];
                    ctx.beginPath();
                    const lx = this.rand(0, w);
                    const ly = this.rand(0, h);
                    const lr = this.rand(10, 60);
                    ctx.arc(lx, ly, lr, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.globalCompositeOperation = 'screen';
                const cloudCount = Math.floor(this.rand(5, 12));
                ctx.fillStyle = palette.cloud;
                for (let i = 0; i < cloudCount; i++) {
                    ctx.beginPath();
                    const cW = this.rand(20, w);
                    const cH = this.rand(5, 15);
                    const cX = this.rand(0, w);
                    const cY = this.rand(0, h);
                    ctx.ellipse(cX, cY, cW, cH, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalCompositeOperation = 'source-over';
                ctx.restore();

                const shadowGrad = ctx.createRadialGradient(cx - r/2.5, cy - r/2.5, r/3, cx, cy, r);
                shadowGrad.addColorStop(0, 'transparent');
                shadowGrad.addColorStop(0.7, 'rgba(0,0,0,0.1)');
                shadowGrad.addColorStop(1, 'rgba(0,0,0,0.7)');
                ctx.fillStyle = shadowGrad;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();

                const highlightGrad = ctx.createRadialGradient(cx - r/3, cy - r/3, 0, cx - r/3, cy - r/3, r/2);
                highlightGrad.addColorStop(0, 'rgba(255,255,255,0.4)');
                highlightGrad.addColorStop(1, 'transparent');
                ctx.fillStyle = highlightGrad;
                ctx.beginPath();
                ctx.arc(cx - r/3, cy - r/3, r/2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = palette.atmosphere;
                ctx.lineWidth = 4;
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(cx, cy, r - 2, 0, Math.PI * 2);
                ctx.stroke();
                ctx.globalAlpha = 1.0;

                return palette.atmosphere;
            }
        }

        // --- 粒子生态模拟 ---
        const gameCanvas = document.getElementById('genesis-canvas');
        const gameCtx = gameCanvas ? gameCanvas.getContext('2d') : null;
        let gameReq;
        let particlesGame = [];
        let ruleMatrix = {};
        const RED = '#ff2a2a';
        const GREEN = '#00ff9d';
        const BLUE = '#00f3ff';
        const WHITE = '#ffffff';
        const colors = [RED, GREEN, BLUE, WHITE];
        const mouse = { x: 0, y: 0, active: false };
        let atomCount = 600;
        const MAX_ATOMS = 800;
        const MAX_SPEED = 2.0;
        const FRICTION = 0.85;
        const FORCE_SCALE = 0.2;
        let epoch = 0;

        class Atom {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.vx = 0;
                this.vy = 0;
                this.color = color;
                this.dead = false;
                this.age = 0;
                this.hp = 100;
            }
        }

        if (gameCanvas) {
            gameCanvas.addEventListener('mousemove', (e) => {
                const rect = gameCanvas.getBoundingClientRect();
                mouse.x = e.clientX - rect.left;
                mouse.y = e.clientY - rect.top;
                mouse.active = true;
            });

            gameCanvas.addEventListener('mouseleave', () => {
                mouse.active = false;
            });
        }

        function randomRules() {
            for (let i = 0; i < colors.length; i++) {
                for (let j = 0; j < colors.length; j++) {
                    ruleMatrix[`${colors[i]}-${colors[j]}`] = (Math.random() * 2 - 1);
                }
            }
            const status = document.getElementById('sim-status');
            if (status) {
                status.innerText = 'RULES_MUTATED';
                status.style.color = '#bc13fe';
                setTimeout(() => {
                    status.innerText = 'STABLE';
                    status.style.color = 'var(--primary)';
                }, 1000);
            }
        }

        function createAtoms(count = atomCount) {
            particlesGame = [];
            for (let i = 0; i < count; i++) {
                particlesGame.push(new Atom(
                    Math.random() * gameCanvas.width,
                    Math.random() * gameCanvas.height,
                    colors[Math.floor(Math.random() * colors.length)]
                ));
            }
            updateCountDisplay();
        }

        function updateCountDisplay() {
            const el = document.getElementById('sim-count');
            if (el) el.innerText = particlesGame.length;
        }

        function updateAtoms() {
            for (let i = 0; i < particlesGame.length; i++) {
                const a = particlesGame[i];
                if (a.dead) continue;

                let fx = 0;
                let fy = 0;

                if (a.color === BLUE) {
                    a.age++;
                    if (a.age > 600) {
                        a.dead = true;
                        continue;
                    }
                }

                for (let j = 0; j < particlesGame.length; j++) {
                    if (i === j) continue;
                    const b = particlesGame[j];
                    if (b.dead) continue;

                    const g = ruleMatrix[`${a.color}-${b.color}`];
                    const dx = a.x - b.x;
                    const dy = a.y - b.y;
                    const d = Math.sqrt(dx * dx + dy * dy);

                    if (d > 0 && d < 100) {
                        let force = 0;
                        if (d < 10) {
                            force = a.color === b.color ? (10 - d) * 0.1 : 0;
                        } else {
                            force = (g * FORCE_SCALE) / d;
                        }
                        fx += force * dx;
                        fy += force * dy;

                        if (d < 10) {
                            if (a.color === RED && b.color === GREEN) {
                                b.dead = true;
                            }
                            if (a.color === BLUE && b.color === RED) {
                                b.hp -= 5;
                                if (b.hp <= 0) b.dead = true;
                            }
                        }
                    }
                }

                if (mouse.active) {
                    const mdx = a.x - mouse.x;
                    const mdy = a.y - mouse.y;
                    const md = Math.sqrt(mdx * mdx + mdy * mdy);
                    if (md > 0 && md < 150) {
                        const mForce = (150 - md) * 0.02;
                        fx += (mdx / md) * mForce;
                        fy += (mdy / md) * mForce;
                    }
                }

                a.vx = (a.vx + fx) * FRICTION;
                a.vy = (a.vy + fy) * FRICTION;

                const speed = Math.sqrt(a.vx * a.vx + a.vy * a.vy);
                if (speed > MAX_SPEED) {
                    const ratio = MAX_SPEED / speed;
                    a.vx *= ratio;
                    a.vy *= ratio;
                }

                a.x += a.vx;
                a.y += a.vy;

                if (a.x <= 0 || a.x >= gameCanvas.width) a.vx *= -1;
                if (a.y <= 0 || a.y >= gameCanvas.height) a.vy *= -1;
                a.x = Math.max(0, Math.min(gameCanvas.width, a.x));
                a.y = Math.max(0, Math.min(gameCanvas.height, a.y));
            }
        }

        function drawGame() {
            if (!gameCtx) return;
            gameCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
            gameCtx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            if (epoch % 5 === 0) {
                particlesGame = particlesGame.filter(p => !p.dead);
            }

            for (let i = 0; i < particlesGame.length; i++) {
                const a = particlesGame[i];
                gameCtx.fillStyle = a.color;
                gameCtx.beginPath();
                gameCtx.arc(a.x, a.y, 1.5, 0, Math.PI * 2);
                gameCtx.fill();
            }

            updateAtoms();

            if (epoch % 2 === 0 && particlesGame.length < MAX_ATOMS) {
                const spawnColor = colors[Math.floor(Math.random() * 3)];
                particlesGame.push(new Atom(
                    Math.random() * gameCanvas.width,
                    Math.random() * gameCanvas.height,
                    spawnColor
                ));
            }

            updateCountDisplay();
            epoch++;
            if (epoch % 10 === 0) {
                const epEl = document.getElementById('sim-epoch');
                if (epEl) epEl.innerText = epoch;
            }

            gameReq = requestAnimationFrame(drawGame);
        }

        function initGame() {
            const container = document.getElementById('game-container');
            if (!container || !gameCanvas || !gameCtx) return;
            gameCanvas.width = container.clientWidth;
            gameCanvas.height = container.clientHeight;
            randomRules();
            createAtoms(600);
            epoch = 0;
            if (gameReq) cancelAnimationFrame(gameReq);
            drawGame();
        }

        function stopGame() {
            if (gameReq) cancelAnimationFrame(gameReq);
        }

        function resetSimulation() {
            createAtoms();
            epoch = 0;
        }

        function mutateRules() {
            randomRules();
        }

        function openViewModal(project) {
            document.getElementById('modal-title').innerText = project.title;
            document.getElementById('modal-date').innerText = project.date || '';
            const contentContainer = document.getElementById('modal-content');
            contentContainer.innerHTML = project.desc;
            openModal('view');

            const trigger = document.getElementById('music-trigger');
            const audio = document.getElementById('planet-audio');
            const icon = document.getElementById('play-icon');

            if (trigger && audio && icon) {
                trigger.onclick = function() {
                    if (audio.paused) {
                        audio.play();
                        icon.className = 'fas fa-pause';
                        trigger.querySelector('button').classList.add('animate-spin-slow');
                    } else {
                        audio.pause();
                        icon.className = 'fas fa-play ml-1';
                        trigger.querySelector('button').classList.remove('animate-spin-slow');
                    }
                };
                audio.onended = function() {
                    icon.className = 'fas fa-play ml-1';
                    trigger.querySelector('button').classList.remove('animate-spin-slow');
                };
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            setupBackgroundMusic();
            document.addEventListener('pointerdown', startBackgroundMusic, { once: true });
            document.addEventListener('keydown', startBackgroundMusic, { once: true });
            if (location.hash.replace('#', '') === 'archive') {
                l2d();
            }
        });
